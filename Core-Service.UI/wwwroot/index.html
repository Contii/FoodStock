<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <!-- Sets the viewport to make the website look good on all devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FoodStock</title>
    <!-- Base URL for all relative URLs in the document -->
    <base href="/" />

    <!-- Link to Bootstrap, Font-awesome and custom CSS for styling -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <!-- Link to the web app manifest file -->
    <link href="manifest.webmanifest" rel="manifest" />

    <link rel="icon" type="image/png" href="favicon.png" />
    
    <!-- Link to additional custom styles -->
    <link href="Core-Service.UI.styles.css" rel="stylesheet" />
</head>

<body> <!-- Main application container -->
    <div id="app">
        <!-- SVG for loading progress indicator -->
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <!-- Text for loading progress -->
        <div class="loading-progress-text"></div>
    </div>

    <!-- Error UI for unhandled errors -->
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Script to load Blazor WebAssembly -->
    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        // Register the service worker if supported by the browser
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(function (registration) {
                    console.log('Service Worker registered with scope:', registration.scope);
                })
                .catch(function (error) {
                    console.log('Service Worker registration failed:', error);
                });
        }
    </script>
</body>

</html>
